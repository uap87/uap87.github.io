<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#d9661a">
<title>Stretched Thin</title>
<style>
:root{
  --bg:#faf6f0; --panel:#ffffff; --ink:#2a2018; --muted:#6f6254; --line:#e6dccd; --soft:#f4ebdd;
  --accent:#c85a12; --accent-ink:#ffffff; --ok:#2f7d4f; --warn:#a85a08; --danger:#b3261e;
  --shadow:0 1px 2px rgba(60,40,10,.08),0 6px 18px rgba(60,40,10,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171310; --panel:#211b16; --ink:#f3ebe0; --muted:#b9ab98; --line:#3b3128; --soft:#2c241c;
    --accent:#f08a3c; --accent-ink:#1b1209; --ok:#6fcf97; --warn:#f2b35c; --danger:#ff8a80;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.is-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;line-height:1.2;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:5px 10px;min-height:32px;font-size:14px}
.btn.quiet{background:transparent}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:12px;padding-bottom:10px}
.top h1{font-size:22px}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1 1 auto;min-width:0}
.grp{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.grp input{width:84px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:1240px;margin:0 auto;-webkit-overflow-scrolling:touch}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .n{opacity:.7;margin-right:4px}

/* home */
.hero{padding:34px 0 14px}
.hero h2{font-size:clamp(30px,5vw,44px)}
.hero p{margin-top:10px;max-width:60ch;color:var(--muted);font-size:17px}
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:12px 0 30px}
.ecard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.ecard:hover{transform:translateY(-2px);border-color:var(--accent)}
.ecard h3{font-size:22px}
.ecard .grpl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.ecard .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding-bottom:26px}
.how div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.how b{display:block;margin-bottom:2px}
.foot{padding:10px 0 40px;font-size:13px;color:var(--muted)}

/* board */
.board{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:20px;align-items:start;padding:16px 0 40px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}
.intro b{font-weight:700}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.meter{flex:1 1 140px;height:8px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:100px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.meter.full i{background:var(--ok)}
.hint{font-size:14px;background:var(--soft);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.hint.on{background:color-mix(in srgb,var(--accent) 16%,transparent);outline:2px solid var(--accent)}
.hint .acts{display:flex;gap:6px}
.curve{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel));border-radius:14px;padding:14px;margin-bottom:12px}
.curve h3{font-size:18px;margin-bottom:6px}
.curve p{margin-top:6px;font-size:15px}
.lockn{font-size:14px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:10px}

.slot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:8px 14px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .12s,background .12s;scroll-margin-top:12px}
.slot.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.slot.target{border-style:dashed;border-color:var(--accent)}
.shead{display:flex;gap:10px;align-items:flex-start;min-width:0}
.sn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.shead h3{font-size:17px}
.shead p{font-size:13px;color:var(--muted);margin-top:2px}
.drop{min-height:62px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;padding:5px;min-width:0}
.drop.empty{justify-content:center;color:var(--muted);font-size:13.5px;text-align:center}
.slot .why{grid-column:1/-1;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;font-size:14.5px}
.slot .why:disabled{opacity:.7}
.ref{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.ref b{color:var(--ink)}

.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:Georgia,"Times New Roman",serif;font-size:18px;touch-action:none;cursor:grab}
.chip{display:flex;gap:10px;align-items:center;width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;position:relative;cursor:grab;-webkit-user-select:none;user-select:none}
.chip.sel,.card.sel{outline:3px solid var(--accent);outline-offset:1px}
.chip.dragging,.card.dragging{opacity:.35}
.chip .txt{min-width:0;flex:1}
.chip b{display:block;font-size:14.5px;line-height:1.2}
.chip small.tg{color:var(--accent);font-weight:700}
.chip small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;gap:2px;align-items:flex-end;height:22px;flex:none}
.bars i{display:block;width:5px;background:var(--accent);border-radius:1px}
.chip .ib{flex:none;border:1px solid var(--line);background:var(--panel);width:30px;height:30px;border-radius:50%;line-height:1;padding:0;font-weight:700;color:var(--muted)}
.chip .ib:hover{border-color:var(--accent);color:var(--accent)}
.two{position:absolute;top:-8px;right:8px;font-size:11px;font-weight:800;background:var(--warn);color:#fff;border-radius:99px;padding:1px 8px}

/* roster */
.roster{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.roster.over{outline:3px dashed var(--accent)}
.roster h3{font-size:17px;margin-bottom:2px}
.roster .rsub{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.card{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px;cursor:grab;position:relative;-webkit-user-select:none;user-select:none}
.card .body{min-width:0;flex:1}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .head b{font-size:15.5px}
.card .tag{font-size:12.5px;color:var(--accent);font-weight:700;display:block}
.card .exp{font-size:12.5px;color:var(--muted);margin:3px 0 5px}
.grip{flex:none;touch-action:none;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);font-size:18px;border-radius:8px;cursor:grab}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;font-size:12.5px}
.skills div{display:flex;justify-content:space-between;gap:6px}
.st{letter-spacing:.3px;font-size:12px;white-space:nowrap}
.st b{color:var(--accent);font-weight:400}
.st i{color:var(--line);font-style:normal}
.card .more p{font-size:13px;margin-top:6px}
.card .more .watch{color:var(--muted)}
.card .more .watch b{color:var(--warn)}
.card .state{font-size:12px;margin-top:6px;font-weight:700}
.card .state.placed{color:var(--ok)}
.card .state.free{color:var(--muted)}
.card .state.out{color:var(--danger)}
.card.out{opacity:.5;cursor:not-allowed}
.card .badge{display:none}

/* discuss */
.narrow{max-width:760px;padding:18px 0 40px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.q h3{font-size:18px}
.q p{font-size:14px;color:var(--muted);margin:3px 0 8px}
.q textarea{width:100%;min-height:96px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:15px;resize:vertical}

/* summary */
.sumh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sumtable{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:14px}
.sumtable th,.sumtable td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.sumtable th{background:var(--soft)}
.sumtable .dn{font-weight:700}
.sumtable .why{display:block;color:var(--muted);margin-top:2px;font-size:13px}
.ans{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px;white-space:pre-wrap}
.ans h4{margin:0 0 4px;font-size:14px}

/* gate */
.gate{max-width:640px;margin:34px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.gate h2{font-size:26px;margin-bottom:8px}
.gate p{color:var(--muted);margin-bottom:14px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:100;background:rgba(20,12,4,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
#modal[hidden]{display:none}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
.sheet .shd{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.sheet .shd .av{width:52px;height:52px;font-size:24px;cursor:default}
.sheet h3{font-size:22px}
.assign{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.assign button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13.5px}
.assign button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
.assign button:disabled{opacity:.4}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#2a2018;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:120;opacity:0;pointer-events:none;transition:opacity .15s;max-width:92vw;text-align:center}
#toast.on{opacity:1}
.ghost{position:fixed;z-index:200;pointer-events:none;display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--accent);border-radius:999px;padding:4px 14px 4px 4px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:700;transform:translate(-20px,-24px)}
.ghost .av{width:36px;height:36px;font-size:16px}

/* mobile / tablet: roster becomes a bottom dock */
@media (max-width:899px){
  .board{display:block;padding-bottom:190px}
  .roster{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:none;overflow:visible;z-index:30;border-radius:16px 16px 0 0;border:0;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.14);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .roster h3,.roster .rsub{display:none}
  .roster .cards{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
  .card{margin:0;padding:6px 0;flex-direction:column;align-items:center;gap:2px;touch-action:none;border-radius:12px;min-width:0}
  .card .body{display:none}
  .card .av{width:36px;height:36px;font-size:17px}
  .card .badge{display:block;font-size:10.5px;font-weight:800;color:var(--muted);min-height:13px}
  .card .badge.placed{color:var(--ok)}
  .card .badge.two{color:var(--warn);position:static;background:none;padding:0}
  .card .badge.out{color:var(--danger)}
  .hint-d{display:none}
  .roster .hint{margin:0 0 8px;padding:6px 10px;font-size:13px}
}
@media (min-width:900px){.hint-m{display:none}}
@media (max-width:1179px){.slot{grid-template-columns:1fr}.board{grid-template-columns:minmax(0,1fr) 420px}}
@media (max-width:599px){
  .slot{grid-template-columns:1fr}
  .top h1{font-size:19px}
  .wrap{padding:0 12px}
  .tabs{padding:0 12px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;color:#000}
  .top,.tabs,.noprint,#toast,#modal,.roster{display:none!important}
  .sumtable{font-size:11px}
  .ans{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>

<script>
(function(){
'use strict';
var DATA = {"skills":["Leadership","Logistics","Scripting/Prog.","Media","Creativity","Satsang"],"karyakars":[{"L":"A","exp":"3 years. Has helped on several events, never owned a department.","r":[3,3,3,3,3,3],"text":"Steady and dependable, with no standout skill and no weak spot. Takes direction well and will do any job decently if expectations are clear.","watch":"Won't push a department forward on his own.","tag":"Steady all-rounder"},{"L":"B","exp":"Under 1 year. First regional event.","r":[1,3,1,1,1,3],"text":"Grew up in satsang, knows the basics well, and finishes small, clearly defined tasks like shopping and setup.","watch":"Very quiet, has never made a decision alone, and needs a mentor and a narrow task.","tag":"New and sincere"},{"L":"C","exp":"8 years. Has led regional events of 100+ people.","r":[5,3,2,1,3,3],"text":"A natural leader: calm in a crisis, decisive, and people follow him. Everyone will want him on their team.","watch":"Takes over other people's work, impatient with detail, weak with media and writing.","tag":"Natural leader"},{"L":"D","exp":"4 years. Made graphics and videos for three regional events.","r":[2,2,3,5,4,2],"text":"Turns a clear brief into polished design and video quickly, and has good creative taste.","watch":"Holds work until it is perfect, uncomfortable managing people, thin on satsang depth so his content needs a check.","tag":"Media specialist"},{"L":"E","exp":"5 years. Has scripted stage programs and coached skits and MCs.","r":[2,2,5,1,3,4],"text":"Writes tight scripts, runs rehearsals well, and knows the satsang behind the material.","watch":"Dislikes logistics, avoids being in charge, goes quiet in large groups, cannot design or edit video.","tag":"Writer and program coach"},{"L":"F","exp":"6 years. Has run food and venues for events of 200+.","r":[4,5,2,2,2,3],"text":"Runs food, venues, and schedules like clockwork, and can step up to lead a practical event.","watch":"Rigid when plans change, slow to improvise, and not a creative thinker.","tag":"Logistics ace"},{"L":"G","exp":"2 years. Has hosted and emceed programs.","r":[2,1,3,3,5,3],"text":"Full of ideas, great in front of a crowd, and keeps the energy high.","watch":"Misses deadlines, forgets details, rarely follows through alone. Needs a partner who tracks the details.","tag":"Idea person and host"},{"L":"H","exp":"12 years. Has mentored many karyakars and led goshtis.","r":[3,2,3,1,2,5],"text":"Deep satsang knowledge, respected by everyone, and excellent at guiding goshtis and giving feedback.","watch":"Slow to adopt new ideas, unfamiliar with media tools, does not like being rushed.","tag":"Senior satsang mentor"}],"qs":[["Which departments need overseeing?","The person is new, or weak in that area. Who will oversee each one?"],["Which departments are self-sufficient?","They can run on their own. How did you decide?"],["What is the biggest risk or issue in your lineup?","Before and after the curveball."],["What kind of 9th karyakar would make your life easier?","Skills, experience, and which department he would take on."]],"events":{"retreat":{"title":"Regional Karyakar Retreat","groups":"Groups 1 and 2","event":"A weekend getaway for regional karyakars to bond and plan for upcoming events. Mostly relaxed: an outing, good food, icebreakers, evening programs, a few goshtis, and morning kathas by santos. It should feel effortless to the people attending.","hard":"The most casual event, which makes it easy to under-staff. The leads carry the weight so everyone else can recharge.","blurb":"A relaxed weekend getaway to bond and plan for upcoming events.","depts":[["Overall Lead","Sets the plan, makes final calls, unblocks everyone"],["Housing and Transportation","Book the lodging, plan carpools and arrival"],["Food and Hospitality","Meals, snacks, dietary needs, shopping"],["Outing","Plan and run the group outing"],["Icebreakers and Evening Programs","Games, bonding, evening flow"],["Goshtis and Planning Sessions","Run the goshtis and the planning for upcoming events"],["Morning Katha and Schedule","Set up the kathas, keep the weekend on time"],["Make It Special","Graphics, video, decor, small touches"]],"curve":{"when":"NINE DAYS BEFORE THE RETREAT","what":"The Airbnb host cancels your booking. The only place left that fits everyone is 90 minutes farther away and has no room big enough for the whole group, so the evening program and goshtis can no longer happen in one space.","also":"Karyakar F has been sent on a work trip and is out for the weekend. He cannot do his job.","rework":"Who covers F's department, and what does the retreat look like in the new house? What do you simplify?"},"out":{"letter":"F","label":"work trip"}},"shibir":{"title":"Summer Shibir","groups":"Groups 3 and 4","event":"A multi-day summer convention, mostly sessions plus practice for skits and MCs. It includes goshti groups, a skills competition (possibly adhiveshan, mukhpath memorization), food, a hotel stay, and kathas in different programs.","hard":"The most satsang-heavy event, with the biggest content load. Satsang depth and scripting sit with only a few people.","blurb":"A multi-day summer convention: sessions, skits, goshtis, and kathas.","depts":[["Overall Lead","Sets the plan, makes final calls, unblocks everyone"],["Sessions and Skit/MC Practice","Plan the sessions, rehearse skits and MCs"],["Katha Program Scripting","Script and flow for programs with kathas"],["Goshti Groups","Topics, facilitators, group setup"],["Skills Competition and Adhiveshan","Design the competition and mukhpath memorization"],["Food","Meals, snacks, dietary needs across all days"],["Logistics, Flow and Hotel","Schedule, transitions, volunteers, rooming"],["Environment, Experience and Media","Decor, graphics, video, the feel of the shibir"]],"curve":{"when":"TWO WEEKS BEFORE THE SHIBIR","what":"The hotel tells you the main ballroom is no longer available on Day 2. Sessions, the skills competition, and evening skit practice now have to share one smaller room, and the Day 2 schedule must shrink by about 90 minutes.","also":"Your Overall Lead has just stepped down because of a family emergency.","rework":"Who leads now, and what gets cut or combined on Day 2?"},"out":{"dept":0,"label":"stepped down"}},"samp":{"title":"Samp Camp (NC27 Practices)","groups":"Groups 5 and 6","event":"A practice camp for NC27 where participants rehearse their programs, with food, kathas by santos, and a place to sleep (mandir or hotel). Programming karyakars make sure practices are done correctly. It only works if participants commit and show up.","hard":"A recurring commitment: the risk is being stretched across many days, and the most visible job is keeping participants coming back.","blurb":"A practice camp for NC27 where participants rehearse and must keep showing up.","depts":[["Overall Lead","Sets the plan, makes final calls, unblocks everyone"],["Practice Coordination","Who practices what, when, and where"],["Practice Quality Check","Make sure practices are being done correctly"],["Scheduling and Logistics","Master schedule, venue, transitions"],["Food","Meals and snacks across the camp"],["Katha and Satsang Flow","Kathas by santos, satsang moments in practice"],["Participant Follow-Up and Hype","Reminders, updates, graphics and videos that keep people showing up"],["Sleeping Arrangements","Decide mandir or hotel, then set it up"]],"curve":{"when":"THREE WEEKS BEFORE CAMP","what":"The mandir tells you the hall is booked for a regional event on two of your practice days, and a group of participants says they can only come on weekends.","also":"Karyakar E, your strongest on practices, is out for the rest of the camp because of a job relocation.","rework":"How do you reschedule practices, and who checks practice quality now?"},"out":{"letter":"E","label":"job relocation"}}}};
var EVENTS = DATA.events, KAR = DATA.karyakars, QS = DATA.qs, SKILLS = DATA.skills;
var byLetter = {}; KAR.forEach(function(k){ byLetter[k.L] = k; });
var STORE_KEY = 'stretched-thin-v1';
var mem = null;

function loadStore(){
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return mem || {events:{}};
}
var store = loadStore();
if (!store.events) store.events = {};
function save(){ mem = store; try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }

function es(id){
  if (!store.events[id]) store.events[id] = {group:'', r1:{a:{},w:{}}, r2:{a:{},w:{}}, revealed:false, out:null, answers:['','','',''], tab:'build'};
  return store.events[id];
}
var route = {ev:null};
var selected = null;   // {letter, from: dept index or null}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hue(letter){ return [18,38,100,160,195,225,275,335][letter.charCodeAt(0)-65]; }
function avStyle(letter){ return 'style="background:hsl('+hue(letter)+' 48% 36%)"'; }
function stars(n){ return '<span class="st" role="img" aria-label="'+n+' of 5 stars"><b>'+'★'.repeat(n)+'</b><i>'+'★'.repeat(5-n)+'</i></span>'; }
function topSkills(k){
  var mx = Math.max.apply(null,k.r), mn = Math.min.apply(null,k.r);
  if (mx === mn) return 'Average across the board';
  return k.r.map(function(v,i){ return {v:v,i:i}; }).sort(function(a,b){ return b.v-a.v || a.i-b.i; }).slice(0,2)
    .map(function(o){ return SKILLS[o.i]+' '+o.v+'★'; }).join(' · ');
}
function bars(k){ return '<span class="bars" title="'+esc(SKILLS.map(function(s,i){ return s+': '+k.r[i]; }).join(', '))+'" aria-hidden="true">'+k.r.map(function(v){ return '<i style="height:'+(v*4+2)+'px"></i>'; }).join('')+'</span>'; }
function jobsOf(letter, a){ return Object.keys(a).filter(function(i){ return a[i] === letter; }).map(Number); }
function filled(a, n){ var c = 0; for (var i=0;i<n;i++) if (a[i]) c++; return c; }
function curRound(s){ return s.tab === 'curve' ? 2 : 1; }
function R(s, round){ return round === 2 ? s.r2 : s.r1; }

var toastT;
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2400); }

/* ---------------- views ---------------- */
function viewHome(){
  var cards = Object.keys(EVENTS).map(function(id){
    var ev = EVENTS[id], s = store.events[id], status = '';
    if (s){
      var n = filled(s.r1.a, ev.depts.length);
      status = s.revealed ? '<span class="pill ok">Curveball round</span>' : (n ? '<span class="pill warn">In progress: '+n+'/8 placed</span>' : '');
    }
    return '<a class="ecard" href="#/'+id+'"><span class="grpl">'+esc(ev.groups)+'</span><h3>'+esc(ev.title)+'</h3><p class="muted">'+esc(ev.blurb)+'</p><div class="go"><span>Open this event →</span>'+status+'</div></a>';
  }).join('');
  return '<header class="top"><div class="wrap"><div class="grow"><h1>Stretched Thin</h1><div class="sub">RCTL planning activity</div></div></div></header>'+
    '<main class="wrap"><section class="hero"><h2>Pick the event your group was assigned.</h2><p>You have the same eight karyakars for every event and eight departments to fill. Drag each karyakar onto the department where he fits best, and say why.</p></section>'+
    '<div class="events">'+cards+'</div>'+
    '<div class="how"><div><b>1. Build the team</b>Drag or tap karyakars onto departments. One karyakar per department.</div><div><b>2. Handle the curveball</b>Something changes. Rework your team, and someone may need to take on two jobs.</div><div><b>3. Discuss</b>Who needs overseeing, what is self-sufficient, and what 9th karyakar you wish you had.</div></div>'+
    '<p class="foot">Your work saves on this device only. Nothing is sent anywhere.</p></main>';
}

function tabsHTML(s){
  var t = [['build','1','Build team'],['curve','2','After curveball'],['discuss','3','Discuss'],['summary','4','Summary']];
  return '<nav class="tabs" aria-label="Steps">'+t.map(function(x){ return '<button class="tab" data-tab="'+x[0]+'" aria-current="'+(s.tab===x[0])+'"><span class="n">'+x[1]+'</span>'+x[2]+'</button>'; }).join('')+'</nav>';
}
function headerHTML(ev, s){
  return '<header class="top"><div class="wrap"><button class="btn small quiet" data-act="home" aria-label="Back to events">← Events</button><div class="grow"><h1>'+esc(ev.title)+'</h1><div class="sub">'+esc(ev.groups)+'</div></div><label class="grp">Group <input type="text" inputmode="numeric" maxlength="12" data-group value="'+esc(s.group)+'" placeholder="#"></label></div>'+tabsHTML(s)+'</header>';
}

function chipHTML(letter, i, round, locked, a){
  var k = byLetter[letter], jobs = jobsOf(letter, a).length;
  return '<div class="chip'+(selected && selected.letter===letter && selected.from===i ? ' sel':'')+'" '+(locked?'':'data-drag data-letter="'+letter+'" data-from="'+i+'" ')+'tabindex="0" role="button" aria-label="Karyakar '+letter+', '+esc(k.tag)+(locked?'':'. Drag or press Enter to move')+'">'+
    (jobs>1 ? '<span class="two">'+jobs+' jobs</span>' : '')+
    '<span class="av" '+avStyle(letter)+'>'+letter+'</span><span class="txt"><b>Karyakar '+letter+'</b><small class="tg">'+esc(k.tag)+'</small><small>'+esc(topSkills(k))+'</small></span>'+bars(k)+
    '<button class="ib" data-info="'+letter+'" aria-label="View profile of Karyakar '+letter+'">i</button>'+
    (locked?'':'<button class="ib" data-remove="'+i+'" aria-label="Remove from this department">×</button>')+'</div>';
}

function cardHTML(k, round, s, locked){
  var a = R(s, round).a, jobs = jobsOf(k.L, a), isOut = round===2 && s.out === k.L;
  var cls = 'card'+(isOut?' out':'')+(selected && selected.letter===k.L && selected.from===null ? ' sel':'');
  var state, badge, badgeCls;
  if (isOut){ state = '<div class="state out">OUT: '+esc(s.outLabel||'unavailable')+'</div>'; badge = 'OUT'; badgeCls='out'; }
  else if (jobs.length){ var names = jobs.map(function(i){ return EVENTS[route.ev].depts[i][0]; });
    state = '<div class="state placed">'+(jobs.length>1 ? jobs.length+' jobs: ' : 'Placed: ')+esc(names.join(', '))+'</div>'; badge = jobs.length>1 ? jobs.length+' jobs' : '✓'; badgeCls = jobs.length>1 ? 'two' : 'placed'; }
  else { state = '<div class="state free">Not placed yet</div>'; badge = ' '; badgeCls=''; }
  var drag = (!isOut && !locked) ? 'data-drag data-letter="'+k.L+'" data-from="pool" ' : '';
  return '<div class="'+cls+'" '+drag+'data-card="'+k.L+'" tabindex="0" role="button" aria-label="Karyakar '+k.L+', '+esc(k.tag)+'">'+
    '<div class="av" '+avStyle(k.L)+'>'+k.L+'</div><span class="badge '+badgeCls+'">'+badge+'</span>'+
    '<div class="body"><div class="head"><div><b>Karyakar '+k.L+'</b><span class="tag">'+esc(k.tag)+'</span></div><span class="grip" aria-hidden="true">⠿</span></div>'+
    '<div class="exp"><b>Experience:</b> '+esc(k.exp)+'</div>'+
    '<div class="skills">'+k.r.map(function(v,j){ return '<div><span>'+SKILLS[j]+'</span>'+stars(v)+'</div>'; }).join('')+'</div>'+
    '<div class="more"><p>'+esc(k.text)+'</p><p class="watch"><b>Watch out:</b> '+esc(k.watch)+'</p></div>'+state+'</div></div>';
}

function hintHTML(cls, s){
  if (selected){
    return '<div class="hint on '+cls+'"><span><b>Karyakar '+selected.letter+'</b> selected. Now tap a department to place him.</span><span class="acts"><button class="btn small" data-info="'+selected.letter+'">Profile</button><button class="btn small" data-act="deselect">Cancel</button></span></div>';
  }
  return '<div class="hint '+cls+'"><span>Drag a karyakar onto a department, or tap one and then tap a department.</span></div>';
}

function viewBoard(ev, s, round){
  var Rr = R(s, round), a = Rr.a, locked = round===1 && s.revealed, n = ev.depts.length, f = filled(a, n);
  var doubled = KAR.filter(function(k){ return jobsOf(k.L, a).length > 1; });
  var html = headerHTML(ev, s) + '<main class="wrap"><div class="board"><div class="slots">';
  if (round === 2){
    html += '<div class="curve"><h3>Curveball: '+esc(ev.curve.when.toLowerCase().replace(/^./, function(c){ return c.toUpperCase(); }))+'</h3><p><b>What changed.</b> '+esc(ev.curve.what)+'</p><p><b>Also.</b> '+esc(ev.curve.also)+'</p><p><b>Rework your plan.</b> '+esc(ev.curve.rework)+'</p></div>';
    html += '<div class="intro">Karyakars can now take on <b>two jobs</b>. Dragging from the list <b>adds</b> a job; dragging a placed karyakar <b>moves</b> him. Note what you changed in each box.</div>';
  } else if (locked){
    html += '<div class="lockn">Round 1 is locked because the curveball has arrived. Go to <b>After curveball</b> to rework your team.</div>';
  } else {
    html += '<div class="intro"><b>'+esc(ev.title)+'.</b> '+esc(ev.event)+'<br><span class="muted">'+esc(ev.hard)+'</span></div>';
  }
  html += '<div class="bar"><div class="meter'+(f===n?' full':'')+'"><i style="width:'+(f/n*100)+'%"></i></div><span><b>'+f+'/'+n+'</b> departments filled</span>'+
    (doubled.length ? '<span class="pill warn">Doubled up: '+doubled.map(function(k){ return k.L; }).join(', ')+'</span>' : '')+
    (f===n && !doubled.length ? '<span class="pill ok">All filled</span>' : '')+'</div>';
  html += hintHTML('hint-d', s);
  html += ev.depts.map(function(d,i){
    var L = a[i], r1 = s.r1.a[i];
    var ref = '';
    if (round === 2){
      var was = r1 ? 'Round 1: <b>Karyakar '+r1+'</b>' : 'Round 1: nobody';
      if (!L && ev.out.dept === i && r1) was += ' (stepped down)';
      else if (!L && s.out && r1 === s.out) was += ' (now out)';
      ref = '<div class="ref">'+was+'</div>';
    }
    var whyKey = i;
    var whyVal = Rr.w[whyKey] || '';
    var ph = round === 2 ? 'What changed, and who watches this one?' : 'Why this person?';
    return '<section class="slot" data-slot="'+i+'" tabindex="-1"><div class="shead"><span class="sn">'+(i+1)+'</span><div><h3>'+esc(d[0])+'</h3><p>'+esc(d[1])+'</p></div></div>'+
      '<div class="drop'+(L?'':' empty')+'" '+(locked?'':'data-drop tabindex="0" role="button" aria-label="Place a karyakar in '+esc(d[0])+'"')+'>'+(L ? chipHTML(L, i, round, locked, a) : '<span>'+(locked?'Empty':'Drop a karyakar here')+'</span>')+'</div>'+
      ref+'<input class="why" type="text" data-why="'+i+'" data-round="'+round+'" value="'+esc(whyVal)+'" placeholder="'+ph+'" '+(locked?'disabled':'')+' aria-label="'+esc(ph)+' for '+esc(d[0])+'"></section>';
  }).join('');
  html += '</div>';
  html += '<aside class="roster" id="roster" aria-label="Karyakars">'+hintHTML('hint-m', s)+'<h3>Your 8 karyakars</h3><div class="rsub">Same team for every event. Ratings out of 5 stars.</div><div class="cards">'+KAR.map(function(k){ return cardHTML(k, round, s, locked); }).join('')+'</div></aside>';
  html += '</div></main>';
  return html;
}

function viewGate(ev, s){
  var f = filled(s.r1.a, ev.depts.length), ready = f === ev.depts.length;
  return headerHTML(ev, s)+'<main class="wrap"><div class="gate"><h2>Ready for the curveball?</h2><p>'+(ready ? 'Wait for your facilitator, then show the curveball. Round 1 will lock so you can compare before and after.' : 'Finish Round 1 first: all '+ev.depts.length+' departments need a karyakar ('+f+'/'+ev.depts.length+' filled).')+'</p><button class="btn primary" data-act="reveal" '+(ready?'':'disabled')+'>Show the curveball</button></div></main>';
}

function viewDiscuss(ev, s){
  return headerHTML(ev, s)+'<main class="wrap narrow"><h2 style="margin-bottom:6px">Discuss as a group</h2><p class="muted" style="margin-bottom:14px">Think about your team after the curveball. Jot down what you land on.</p>'+
    QS.map(function(q,i){ return '<div class="q"><h3>'+(i+1)+'. '+esc(q[0])+'</h3><p>'+esc(q[1])+'</p><textarea data-ans="'+i+'" aria-label="'+esc(q[0])+'">'+esc(s.answers[i]||'')+'</textarea></div>'; }).join('')+
    '<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-tab="summary">See summary</button><button class="btn" data-tab="curve">Back to team</button></div></main>';
}

function karLine(letter){ return letter ? '<span class="dn">Karyakar '+letter+'</span> ('+esc(byLetter[letter].tag)+')' : '<span class="muted">Nobody</span>'; }
function viewSummary(ev, s){
  var rows = ev.depts.map(function(d,i){
    var r1 = s.r1.a[i], r2 = s.r2.a[i];
    return '<tr><td class="dn">'+esc(d[0])+'</td><td>'+karLine(r1)+(s.r1.w[i] ? '<span class="why">'+esc(s.r1.w[i])+'</span>' : '')+'</td><td>'+(s.revealed ? karLine(r2)+(s.r2.w[i] ? '<span class="why">'+esc(s.r2.w[i])+'</span>' : '') : '<span class="muted">Curveball not shown yet</span>')+'</td></tr>';
  }).join('');
  var answers = QS.map(function(q,i){ return '<div class="ans"><h4>'+(i+1)+'. '+esc(q[0])+'</h4>'+(s.answers[i] ? esc(s.answers[i]) : '<span class="muted">No answer yet</span>')+'</div>'; }).join('');
  return headerHTML(ev, s)+'<main class="wrap narrow" style="max-width:980px"><div class="sumh"><div><h2>'+esc(ev.title)+(s.group ? ' · Group '+esc(s.group) : '')+'</h2><p class="muted">Your team before and after the curveball.</p></div><div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="print">Print or save PDF</button><button class="btn" data-act="copy">Copy as text</button></div></div>'+
    '<div style="overflow-x:auto"><table class="sumtable"><thead><tr><th>Department</th><th>Round 1</th><th>After curveball</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<h3 style="margin:18px 0 4px">Discussion</h3>'+answers+
    '<div class="noprint" style="margin-top:18px"><button class="btn quiet" data-act="reset">Start this event over</button></div></main>';
}

function viewEvent(){
  var ev = EVENTS[route.ev], s = es(route.ev);
  if (s.tab === 'build') return viewBoard(ev, s, 1);
  if (s.tab === 'curve') return s.revealed ? viewBoard(ev, s, 2) : viewGate(ev, s);
  if (s.tab === 'discuss') return viewDiscuss(ev, s);
  return viewSummary(ev, s);
}

function render(){
  var y = window.scrollY, c0 = document.querySelector('.roster'), rs = c0 ? c0.scrollTop : 0;
  document.getElementById('app').innerHTML = route.ev ? viewEvent() : viewHome();
  var c1 = document.querySelector('.roster'); if (c1) c1.scrollTop = rs;
  window.scrollTo(0, y);
  document.title = route.ev ? EVENTS[route.ev].title + ' | Stretched Thin' : 'Stretched Thin';
}

/* ---------------- actions ---------------- */
function place(letter, dept, fromDept){
  var s = es(route.ev), round = curRound(s), Rr = R(s, round), a = Rr.a;
  if (round === 1 && s.revealed) return;
  if (round === 2 && s.out === letter){ toast('Karyakar '+letter+' is out and cannot take a job.'); return; }
  var occupant = a[dept];
  if (fromDept !== null && fromDept !== undefined){
    if (fromDept === dept) return;
    if (occupant) a[fromDept] = occupant; else delete a[fromDept];
    a[dept] = letter;
  } else {
    if (round === 1){ Object.keys(a).forEach(function(i){ if (a[i] === letter) delete a[i]; }); }
    a[dept] = letter;
  }
  selected = null; save(); render();
  var n = filled(a, EVENTS[route.ev].depts.length);
  if (n === EVENTS[route.ev].depts.length) toast(round === 1 ? 'All departments filled. Check your reasons, then go to After curveball.' : 'All departments filled.');
}
function unassign(dept){
  var s = es(route.ev), round = curRound(s);
  if (round === 1 && s.revealed) return;
  delete R(s, round).a[dept]; selected = null; save(); render();
}
function placeSelected(dept){
  if (!selected) return;
  place(selected.letter, dept, selected.from === null ? null : selected.from);
}
function revealCurve(){
  var s = es(route.ev), ev = EVENTS[route.ev];
  if (filled(s.r1.a, ev.depts.length) < ev.depts.length){ toast('Fill all departments in Round 1 first.'); return; }
  if (!confirm('Show the curveball now? Round 1 will be locked.')) return;
  var out = ev.out.letter ? ev.out.letter : s.r1.a[ev.out.dept];
  s.revealed = true; s.out = out; s.outLabel = ev.out.label;
  s.r2.a = {}; Object.keys(s.r1.a).forEach(function(i){ if (s.r1.a[i] !== out) s.r2.a[i] = s.r1.a[i]; });
  s.r2.w = {}; save(); render(); window.scrollTo(0,0);
}
function summaryText(){
  var ev = EVENTS[route.ev], s = es(route.ev), L = [];
  L.push(ev.title + (s.group ? ' - Group ' + s.group : '')); L.push('');
  ev.depts.forEach(function(d,i){
    var r1 = s.r1.a[i], r2 = s.r2.a[i];
    L.push(d[0]); L.push('  Round 1: ' + (r1 ? 'Karyakar '+r1 : 'nobody') + (s.r1.w[i] ? ' - ' + s.r1.w[i] : ''));
    if (s.revealed) L.push('  After curveball: ' + (r2 ? 'Karyakar '+r2 : 'nobody') + (s.r2.w[i] ? ' - ' + s.r2.w[i] : ''));
  });
  L.push(''); QS.forEach(function(q,i){ L.push((i+1)+'. '+q[0]); L.push('   '+(s.answers[i] || '(no answer)')); });
  return L.join('\n');
}
function copyText(t){
  function fb(){ var ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied.'); }catch(e){ toast('Could not copy.'); } document.body.removeChild(ta); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ toast('Copied.'); }, fb); else fb();
}

function openProfile(letter){
  var k = byLetter[letter], s = route.ev ? es(route.ev) : null, round = s ? curRound(s) : 1;
  var a = s ? R(s, round).a : {}, locked = s && round===1 && s.revealed, isOut = s && round===2 && s.out === letter;
  var jobs = jobsOf(letter, a);
  var html = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Karyakar '+letter+' profile"><div class="shd"><span class="av" '+avStyle(letter)+'>'+letter+'</span><div><h3>Karyakar '+letter+'</h3><span class="tag" style="color:var(--accent);font-weight:700">'+esc(k.tag)+'</span></div></div>'+
    '<div class="exp muted" style="font-size:14px;margin-bottom:8px"><b>Experience:</b> '+esc(k.exp)+'</div><div class="skills" style="font-size:14px">'+k.r.map(function(v,j){ return '<div><span>'+SKILLS[j]+'</span>'+stars(v)+'</div>'; }).join('')+'</div>'+
    '<p style="margin-top:10px">'+esc(k.text)+'</p><p class="muted" style="margin-top:6px"><b style="color:var(--warn)">Watch out:</b> '+esc(k.watch)+'</p>';
  if (s && !locked && !isOut){
    html += '<h4 style="margin:14px 0 0;font-size:14px">Place Karyakar '+letter+' in:</h4><div class="assign">'+EVENTS[route.ev].depts.map(function(d,i){
      return '<button data-assign="'+i+'" data-letter="'+letter+'" aria-pressed="'+(jobs.indexOf(i)>=0)+'">'+(i+1)+'. '+esc(d[0])+(a[i] && a[i]!==letter ? ' <span class="muted">(has '+a[i]+')</span>' : '')+'</button>';
    }).join('')+'</div>';
  }
  html += '<div style="margin-top:14px;text-align:right"><button class="btn" data-act="close">Close</button></div></div>';
  var m = document.getElementById('modal'); m.innerHTML = html; m.hidden = false;
  var f = m.querySelector('[data-act="close"]'); if (f) f.focus();
}
function closeModal(){ var m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; }

/* ---------------- events ---------------- */
var suppressClick = false;
document.addEventListener('click', function(e){
  if (suppressClick) return;
  var t = e.target;
  if (!t.closest) return;
  var m = document.getElementById('modal');
  if (!m.hidden){
    var as = t.closest('[data-assign]');
    if (as){ var letter = as.getAttribute('data-letter'), dept = +as.getAttribute('data-assign'); closeModal(); var s0 = es(route.ev), r0 = curRound(s0), already = jobsOf(letter, R(s0,r0).a); place(letter, dept, (r0===1 && already.length) ? already[0] : null); return; }
    if (t.closest('[data-act="close"]') || t === m){ closeModal(); return; }
    return;
  }
  var tab = t.closest('[data-tab]');
  if (tab){ var s = es(route.ev); s.tab = tab.getAttribute('data-tab'); selected = null; save(); render(); window.scrollTo(0,0); return; }
  var act = t.closest('[data-act]');
  if (act){
    var a = act.getAttribute('data-act');
    if (a === 'home'){ location.hash = '#/'; return; }
    if (a === 'deselect'){ selected = null; render(); return; }
    if (a === 'reveal'){ revealCurve(); return; }
    if (a === 'print'){ window.print(); return; }
    if (a === 'copy'){ copyText(summaryText()); return; }
    if (a === 'reset'){ if (confirm('Clear everything for this event and start over?')){ delete store.events[route.ev]; selected = null; save(); render(); } return; }
  }
  var info = t.closest('[data-info]'); if (info){ openProfile(info.getAttribute('data-info')); return; }
  var rm = t.closest('[data-remove]'); if (rm){ unassign(+rm.getAttribute('data-remove')); return; }
  if (!route.ev) return;
  var slot = t.closest('[data-slot]');
  if (selected && slot && !t.closest('input')){ placeSelected(+slot.getAttribute('data-slot')); return; }
  var chip = t.closest('.chip'), card = t.closest('.card');
  var s2 = es(route.ev), round2 = curRound(s2);
  if ((chip && chip.hasAttribute('data-drag')) || (card && card.hasAttribute('data-drag'))){
    var el = chip || card, letter2 = el.getAttribute('data-letter'), from = el.getAttribute('data-from');
    var f = from === 'pool' ? null : +from;
    if (selected && selected.letter === letter2 && selected.from === f) selected = null; else selected = {letter: letter2, from: f};
    render(); return;
  }
  if (card && card.classList.contains('out')){ toast('Karyakar '+card.getAttribute('data-card')+' is out for this round.'); return; }
  if (card && !card.hasAttribute('data-drag')){ openProfile(card.getAttribute('data-card')); return; }
});

document.addEventListener('input', function(e){
  var t = e.target; if (!t.matches) return;
  var s = route.ev ? es(route.ev) : null;
  if (t.matches('[data-why]')){ R(s, +t.getAttribute('data-round')).w[t.getAttribute('data-why')] = t.value; save(); }
  else if (t.matches('[data-ans]')){ s.answers[+t.getAttribute('data-ans')] = t.value; save(); }
  else if (t.matches('[data-group]')){ s.group = t.value; save(); }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ if (!document.getElementById('modal').hidden) closeModal(); else if (selected){ selected = null; render(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.card,.chip,.drop') && !e.target.closest('input')){
    e.preventDefault(); e.target.click();
  }
});

/* ---------------- pointer drag (mouse and touch) ---------------- */
var drag = null, ghost = null, lastPt = {x:0,y:0}, rafId = 0;
document.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var t = e.target; if (!t.closest) return;
  if (t.closest('input,textarea,select,.ib,[data-act],.hint')) return;
  var el = t.closest('[data-drag]'); if (!el) return;
  if (e.pointerType === 'touch'){
    var ta = window.getComputedStyle(el).touchAction;
    if (ta !== 'none' && !t.closest('.av,.grip')) return;
  }
  drag = {el: el, letter: el.getAttribute('data-letter'), from: el.getAttribute('data-from'), x: e.clientX, y: e.clientY, active: false, id: e.pointerId};
}, true);

function targetAt(x, y){
  var n = document.elementFromPoint(x, y); if (!n) return null;
  var slot = n.closest('[data-slot]'); if (slot && slot.querySelector('[data-drop]')) return {type:'slot', el: slot};
  var ros = n.closest('#roster'); if (ros) return {type:'roster', el: ros};
  return null;
}
function clearOver(){ var o = document.querySelectorAll('.over'); for (var i=0;i<o.length;i++) o[i].classList.remove('over'); }
function startDrag(){
  drag.active = true;
  ghost = document.createElement('div'); ghost.className = 'ghost';
  ghost.innerHTML = '<span class="av" '+avStyle(drag.letter)+'>'+drag.letter+'</span>Karyakar '+drag.letter;
  document.body.appendChild(ghost); document.body.classList.add('is-dragging'); drag.el.classList.add('dragging');
  selected = null;
  loop();
}
var zoneDir = 0, zoneSince = 0;
function loop(){
  if (!drag || !drag.active) return;
  var y = lastPt.y, h = window.innerHeight, mobile = window.innerWidth < 900;
  var ros = document.getElementById('roster'), dockH = (mobile && ros) ? ros.offsetHeight : 0, dir = 0;
  if (y < 70) dir = -1;
  else if (!mobile && y > h - 70) dir = 1;
  else if (mobile && y > h - dockH - 60 && y < h - dockH) dir = 1;
  var now = Date.now();
  if (dir !== zoneDir){ zoneDir = dir; zoneSince = now; }
  if (dir !== 0 && now - zoneSince > 350) window.scrollBy(0, dir * 9);
  rafId = requestAnimationFrame(loop);
}
document.addEventListener('pointermove', function(e){
  if (!drag || e.pointerId !== drag.id) return;
  lastPt = {x: e.clientX, y: e.clientY};
  if (!drag.active){
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 8) return;
    startDrag();
  }
  e.preventDefault();
  ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
  clearOver();
  var tg = targetAt(e.clientX, e.clientY); if (tg) tg.el.classList.add('over');
}, {passive:false});
function endDrag(e, cancelled){
  if (!drag || (e && e.pointerId !== drag.id)) return;
  var d = drag; drag = null; cancelAnimationFrame(rafId);
  if (!d.active) return;
  var tg = (!cancelled && e) ? targetAt(e.clientX, e.clientY) : null;
  if (ghost){ ghost.remove(); ghost = null; }
  document.body.classList.remove('is-dragging'); d.el.classList.remove('dragging'); clearOver();
  suppressClick = true; setTimeout(function(){ suppressClick = false; }, 15);
  var from = d.from === 'pool' ? null : +d.from;
  if (!tg){ render(); return; }
  if (tg.type === 'slot') place(d.letter, +tg.el.getAttribute('data-slot'), from);
  else if (tg.type === 'roster'){ if (from !== null) unassign(from); else render(); }
}
document.addEventListener('pointerup', function(e){ endDrag(e, false); });
document.addEventListener('pointercancel', function(e){ endDrag(e, true); });
document.addEventListener('dragstart', function(e){ if (e.target.closest && e.target.closest('[data-drag]')) e.preventDefault(); });

/* ---------------- routing ---------------- */
function parseHash(){
  var m = /^#\/([a-z]+)/.exec(location.hash || ''); route.ev = (m && EVENTS[m[1]]) ? m[1] : null; selected = null;
  closeModal(); render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', parseHash);
parseHash();
})();
</script>
